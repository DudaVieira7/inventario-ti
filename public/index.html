<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">

    <title>Sistema de  Inventário de Empresa de TI</title>
</head>
<body>

    <header>
        <h1>Inventário de TI</h1>
    </header>
    
    <main class="system">



<!--------------------Formulário de cadastro e atualização do sistema-->

        <div class="sistema-formulario">
            <h2>Novo equipamento</h2><br>
            <form id="formulario" action="/salvar-equipamento" method="POST">

                <div class="info-form">
                    <label for="quantidade">Quantidade</label>
                    <input type="number" id="quantidade" name="quantidade" min="1" placeholder="Ex: 7">
                </div>
            
                <div class="info-form">
                    <label for="nome">Nome do Equipamento</label>
                    <input type="text" id="nome" name="nome" placeholder="Ex: Dell Inspiron 15 ou Mouse Logitech">
                </div>

                <div class="info-form">
                    <label for="categoria">Categoria:</label>
                    <select id="categoria" name="categoria"  class="label-form">
                        <option value="" disabled selected>Escolha a categoria...</option>
                        <option value="computador">Computador</option>
                        <option value="periferico">Periférico</option>
                        <option value="rede">Rede</option>
                    </select>
                </div>

                <div class="info-form">
                    <label for="status">Status:</label>
                    <select id="status" name="status" class="label-form">
                        <option value="" disabled selected >Escolha o status atual...</option>
                        <option value="disponivel">Disponível</option>
                        <option value="em_uso">Em uso</option>
                        <option value="em_manutencao">Em manutenção</option>
                    </select>
                </div>

            
                <button type="submit" style="padding: 8px 15px; cursor: pointer;" id="adicionar"> Adicionar</button>
            </form>

        </div>

<!--- parte inferior onde mostra os itens cadastrados  e os filtros  do  sistema-->

        <div class="equipamentos">
            <div class="filtros">
                <div class="filtro-item">
                    <label for="filtro-status">Todos os Status</label>
                    <select name="filtro-status" id="filtro-status" class="label-form">
                        <option value="">Todos os status</option>
                        <option value="disponivel">Disponível</option>
                        <option value="em_uso">Em uso</option>
                        <option value="em_manutencao">Em manutenção</option>
                    </select>
                </div>
                <div class="filtro-item">
                    <label for="filtro-categoria" >Filtrar Categoria</label>
                    <select name="filtro-categoria" id="filtro-categoria" class="label-form">
                        <option value="">Todas as categorias</option>
                        <option value="computador">Computador</option>
                        <option value="periferico">Periférico</option>
                        <option value="rede">Rede</option>
                    </select>
                </div>
                <button type="button" id="limpar-filtros">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-filter-right" viewBox="0 0 16 16">
                    <path d="M14 10.5a.5.5 0 0 0-.5-.5h-3a.5.5 0 0 0 0 1h3a.5.5 0 0 0 .5-.5m0-3a.5.5 0 0 0-.5-.5h-7a.5.5 0 0 0 0 1h7a.5.5 0 0 0 .5-.5m0-3a.5.5 0 0 0-.5-.5h-11a.5.5 0 0 0 0 1h11a.5.5 0 0 0 .5-.5"/>
</svg>
                    Limpar Filtros</button>
            </div>

            <div class="contar-itens">
                <span id="total-itens"> 0 itens cadastrados</span>
            </div>
            <div class="tabela-itens">
                <table id="tabela-equipamentos">
                    <thead>
                        <tr>
                            <th>Nome</th>
                            <th>Categoria</th>
                            <th>Quantidade</th>
                            <th>Status</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="corpo-tabela">

                        <!---Aqui vai entrar os itens dinâmicos da tabela --->

                    </tbody>
                </table>
            </div>
            <p id="mensagem-vazia" class="mensagem-vazia" style="display: none;">
                
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-box2" viewBox="0 0 16 16">
                <path d="M2.95.4a1 1 0 0 1 .8-.4h8.5a1 1 0 0 1 .8.4l2.85 3.8a.5.5 0 0 1 .1.3V15a1 1 0 0 1-1 1H1a1 1 0 0 1-1-1V4.5a.5.5 0 0 1 .1-.3zM7.5 1H3.75L1.5 4h6zm1 0v3h6l-2.25-3zM15 5H1v10h14z"/>
                </svg>

                 Não foi encontrado nenhum item
                
            </p>
        </div>

        <div id="toast" class="toast" style="display: none;"></div>


    </main>
    <footer>

        

    </footer>


    <script src="./script.js"></script>
</body>
</html>
